<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            display: flex;
            width: 80%;
            height: 300px;
            margin-left: auto;
            margin-right: auto;
            margin-top: auto;
            padding-top:40px;
        }
         .card1, .card2{
            width: 150%;
            height: 500px;
         }
            .card1{
                background-color: white;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            }
            .card2{
               background-color: #2BC890;
            }
    </style>
</head>
<body style="background-color: #DDDDDD;"></body>
<center>
    <div class="card">
        <div class="card1">
            <br>
            <br>
            <br>
            <br>
            <h1>Sign in </h1>
            <input type="text" placeholder="your email" style="width: 90%; height:40px; border-radius:5px; border:none; background-color:#EFEFEF; padding-left:10px;"><br><br>
            <input type="password" placeholder="your password" style="width: 90%; height:40px; border-radius:5px; border:none; background-color:#EFEFEF; padding-left:10px;"><br><br>
            <button style="width: 90%; height:40px; border-radius:10px; border:none; background-color:#059669; color:white">sign in</button>
            <p>or sign in with</p><br>
            <i class="fa-brands fa-facebook" style="background-color: #3A5897; color:white"></i>
            &nbsp;&nbsp
            <i class="fa-brands fa-google" style="background-color:#D95139; color:white;"></i>
            &nbsp;
            <i class="fa-brands fa-linkedin-in" style="background-color: #0F76AA; color:white"></i>

        </div>
        <div class="card2">
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <h1 style="color: white;">Welcome back</h1>
            <p style="color:white;">welcome back! we are so happy to have you here.it's great to see you again. we hope you had a safe and enjoyable time away.</p><br><br>
            <button style="width: 60%; height:40px; border-radius:10px; border:none; background-color:#10B981; color:white;">No account yet sign up.</button>
        </div>
    </div>
</center>
</div>
</body>
</html>
